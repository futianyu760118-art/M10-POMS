<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fbd">
<title>EBMS 经营 · 手机版</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--line:#e2e9f3;--text:#16283f;--muted:#7186a0;--blue:#2f6fbd;--green:#1c8a4e;--red:#c0392b;--orange:#c47a12}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:20px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#2f6fbd,#4a9be0);color:#fff;padding:12px 14px;border-radius:0 0 14px 14px;display:flex;align-items:center;gap:10px}
.top a{color:#fff;text-decoration:none;font-size:18px}
.top h1{font-size:16px;margin:0;flex:1}
.top .st{font-size:11px;opacity:.9}
.wrap{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);background:#f6f9fd;color:var(--muted);white-space:nowrap}
.tag.ok{background:#eefaf2;border-color:#bfe6cd;color:var(--green)}
.tag.bad{background:#fdf1f0;border-color:#f0c9c4;color:var(--red)}
.tag.blue{background:#eef5fd;border-color:#c9dcf5;color:#24508f}
.tag.orange{background:#fff8ec;border-color:#f1dcb6;color:var(--orange)}
.item{display:flex;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid #f1f5fa}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:11px}
.dl>div{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid #f1f5fa}
.dl span{width:88px;color:var(--muted);flex:none}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;text-decoration:none;display:inline-flex}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.notice{font-size:12px;color:#24508f;background:#eef5fd;border:1px solid #c9dcf5;border-radius:10px;padding:9px 11px;margin-bottom:10px}
.notice.warn{color:#8a5a12;background:#fffbf3;border-color:#f1dcb6}
.empty{color:var(--muted);font-size:12px;padding:8px 2px}
.sheet{position:fixed;inset:0;background:rgba(10,20,35,.5);display:none;z-index:70;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-box{background:#fff;width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.sheet h3{margin:0 0 10px;font-size:15px}
</style>
</head>
<body>
<div class="top">
  <a href="/m">‹</a>
  <h1>EBMS 经营</h1>
  <span class="st" id="conn">检查连接…</span>
</div>
<div class="wrap">
  <div class="notice" id="tip">数据来自 EBMS（M03）；点条目看明细，处理请到 EBMS（这里只读）。</div>
  <label class="muted" style="display:flex;gap:6px;align-items:center;font-size:12px;margin:0 0 10px"><input type="checkbox" id="chkHideDone" checked onchange="state.hideDone=this.checked;loadAll()"> 隐藏已完成/已关闭</label>
  <div class="card"><h2>我的岗位 <span class="tag" id="wsTag">—</span></h2><div class="dl" id="ws"><div class="empty">加载中…</div></div></div>
  <div class="card"><h2>待办事项 <span class="tag" id="wiTag">—</span></h2><div id="wi"><div class="empty">加载中…</div></div></div>
  <div class="card"><h2>经营结果 <span class="tag" id="resTag">—</span></h2><div id="res"><div class="empty">加载中…</div></div></div>
  <div style="display:flex;gap:8px">
    <a class="btn" id="openEbms" href="#" target="_blank" rel="noopener">打开 EBMS 系统</a>
    <a class="btn" href="/m">返回工作台</a>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-box">
    <h3 id="shTitle">明细</h3>
    <div class="dl" id="shBody"></div>
    <div id="shActions" style="margin-top:12px"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(p) {
  const r = await fetch(p, { credentials: 'same-origin' });
  let j = null; try { j = await r.json(); } catch (e) { j = { error: 'HTTP ' + r.status }; }
  if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { status: r.status });
  return j;
}
const unwrap = (x) => (x && x.data !== undefined) ? x.data : x;
const state = { wi: [], res: [], hideDone: true };

function openSheet(title, pairs, actionsHtml) {
  $('shTitle').textContent = title;
  $('shBody').innerHTML = pairs.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v == null || v === '' ? '—' : (typeof v === 'object' ? JSON.stringify(v) : v))}</b></div>`).join('');
  $('shActions').innerHTML = actionsHtml || '';
  $('sheet').classList.add('on');
}
window.closeSheet = () => $('sheet').classList.remove('on');
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });

window.wiDetail = (i) => {
  const r = state.wi[i]; if (!r) return;
  const pairs = Object.keys(r).map(k => [k, r[k]]);
  openSheet(r.title || r.name || '待办明细', pairs,
    '<a class="btn" href="' + $('openEbms').href + '" target="_blank" rel="noopener">去 EBMS 处理</a>');
};
window.resDetail = (i) => {
  const r = state.res[i]; if (!r) return;
  const pairs = Object.keys(r).map(k => [k, r[k]]);
  openSheet(r.title || '结果明细', pairs, '');
};

(async () => {
  $('openEbms').href = 'http://' + location.hostname + ':3010/m10.html';
  let personId = 1;
  try { const me = await api('/api/v1/mobile/me'); if (me.loggedIn && me.user.personId) personId = me.user.personId; } catch (e) { /* ignore */ }

  try {
    const st = await api('/api/v1/ebms/status');
    $('conn').textContent = st.connected ? '已连接' : (st.configured ? '连接失败' : '未配置');
    if (!st.connected) { $('tip').className = 'notice warn'; $('tip').textContent = 'EBMS 暂时连不上：' + (st.error || '请检查地址/账号'); }
  } catch (e) { $('conn').textContent = '连接检查失败'; }

  try {
    const w = unwrap(await api('/api/v1/ebms/workspace?person_id=' + encodeURIComponent(personId))) || {};
    $('wsTag').textContent = w.person_unmapped ? '未映射' : '已映射';
    $('ws').innerHTML = [
      ['姓名', w.name], ['部门', w.department || '—'], ['角色', (w.role_codes || []).join('、') || '—'],
      ['岗位', (w.positions || []).join('、') || '—']
    ].map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v || '—')}</b></div>`).join('');
    if (w.person_unmapped) $('tip').innerHTML = '这个账号在 EBMS 里还没有对应人员，可能看不到自己的事项；请到 EBMS 关联。';
  } catch (e) { $('ws').innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`; }

  try {
    const d = unwrap(await api('/api/v1/ebms/work-items?person_id=' + encodeURIComponent(personId))) || {};
    state.wi = d.items || [];
    const wiShown = state.hideDone ? state.wi.filter(r => r.status !== 'done' && r.status !== 'closed') : state.wi;
    $('wiTag').textContent = (d.summary && d.summary.total != null ? d.summary.total : state.wi.length) + ' 条';
    state.wi = wiShown;
    $('wi').innerHTML = state.wi.length ? state.wi.map((r, i) => `<div class="item" onclick="wiDetail(${i})"><span class="tag ${r.status === 'done' ? 'ok' : (r.status === 'blocked' || r.status === 'overdue' ? 'bad' : 'blue')}">${esc(r.status || '')}</span>
      <div class="body"><b>${esc(r.title || r.name || r.summary || '')}</b><small>${esc(r.due_date || r.due || '')} ${esc(r.owner || '')}</small></div></div>`).join('') : '<div class="empty">暂无待办事项</div>';
  } catch (e) { $('wi').innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`; }

  try {
    const d = unwrap(await api('/api/v1/ebms/results?person_id=' + encodeURIComponent(personId))) || {};
    state.res = d.results || [];
    $('resTag').textContent = state.res.length + ' 条';
    $('res').innerHTML = state.res.length ? state.res.slice(0, 10).map((r, i) => `<div class="item" onclick="resDetail(${i})"><span class="tag ${r.verification === 'verified' ? 'ok' : 'orange'}">${r.verification === 'verified' ? '已验收' : '待验收'}</span>
      <div class="body"><b>${esc(r.title || '')}</b><small>${esc(r.source_system || '')} · ${esc((r.verified_at || '').slice(0, 10))}</small></div></div>`).join('') : '<div class="empty">暂无结果</div>';
  } catch (e) { $('res').innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
