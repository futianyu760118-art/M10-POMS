<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fbd">
<title>AEOS 手机工作台</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--line:#e2e9f3;--text:#16283f;--muted:#7186a0;--blue:#2f6fbd;--green:#1c8a4e;--red:#c0392b;--orange:#c47a12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:76px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#2f6fbd,#4a9be0);color:#fff;padding:13px 16px 12px;border-radius:0 0 16px 16px}
.top .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:16px;margin:0;font-weight:600}
.top .sub{font-size:11px;opacity:.9;margin-top:2px}
.top .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff;font-size:12px;padding:6px 11px;border-radius:9px}
.wrap{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:#f6f9fd;color:var(--muted);white-space:nowrap}
.tag.ok{background:#eefaf2;border-color:#bfe6cd;color:var(--green)}
.tag.bad{background:#fdf1f0;border-color:#f0c9c4;color:var(--red)}
.tag.warn{background:#fff8ec;border-color:#f1dcb6;color:var(--orange)}
.tag.blue{background:#eef5fd;border-color:#c9dcf5;color:#24508f}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11px;color:var(--muted)}
.item{display:flex;gap:9px;align-items:center;padding:9px 2px;border-bottom:1px solid #f1f5fa}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:11px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.small{padding:5px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid #d5dfec;border-radius:10px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:#8fb8e8;box-shadow:0 0 0 3px rgba(47,111,189,.12)}
.empty{color:var(--muted);font-size:12px;padding:8px 2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.nav button{background:none;border:0;font:inherit;font-size:11px;color:var(--muted);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:var(--blue);font-weight:600}
.nav .ico{font-size:17px;line-height:1}
.notice{font-size:12px;color:#24508f;background:#eef5fd;border:1px solid #c9dcf5;border-radius:10px;padding:9px 11px;margin-bottom:10px;line-height:1.65}
.muted{color:var(--muted)}
.sec-title{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.chipbtn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font:inherit;font-size:12px;color:var(--muted)}
.chipbtn.on{background:#eef5fd;border-color:#9cc2ea;color:#1d4ed8;font-weight:600}
.suggwrap{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(15,39,68,.12);z-index:25;max-height:220px;overflow:auto;display:none}
.sugg.on{display:block}
.sugg div{padding:9px 11px;font-size:13px;border-bottom:1px solid #f2f6fb;display:flex;justify-content:space-between;gap:8px}
.sugg div:last-child{border-bottom:0}
.sugg div:hover{background:#f5f9ff}
.sugg small{color:var(--muted);font-size:11px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photoPrev{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.photoPrev img{width:50px;height:50px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.scan{position:fixed;inset:0;background:rgba(10,20,35,.8);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.scan .box{background:#0f1c2e;border-radius:16px;padding:12px;width:100%;max-width:420px;color:#fff}
.scan video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}
.scan .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.scan .tip{font-size:12px;opacity:.85;margin-top:8px;line-height:1.5}
.scan .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);background:#16283f;color:#fff;font-size:13px;padding:9px 15px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dl>div{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid #f1f5fa}
.dl span{width:82px;color:var(--muted);flex:none}
.sheet{position:fixed;inset:0;background:rgba(10,20,35,.5);display:none;z-index:70;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-box{background:#fff;width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.sheet h3{margin:0 0 10px;font-size:15px}
</style>
</head>
<body>
<div class="top">
  <div class="r">
    <div>
      <h1 id="who">加载中…</h1>
      <div class="sub" id="whoSub"></div>
    </div>
    <button class="btn" onclick="switchAccount()">切换</button>
  </div>
</div>

<div class="wrap">
  <!-- 待办 -->
  <div id="tab-todos">
    <div class="card">
      <h2>我的待办 <span class="tag" id="todoTag">—</span></h2>
      <div class="kpis" id="todoKpis"></div>
      <div class="row" id="todoCats" style="margin-bottom:6px"></div>
      <div id="todoList"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <!-- 采集 -->
  <div id="tab-capture" style="display:none">
    <div class="card">
      <h2>品质检验 / 采集 <span class="tag" id="capRoleTag">—</span></h2>
      <div class="notice">扫码或输入料号（支持模糊查），按岗位允许的类型填写；提交后进入待审核，不能自己验收。</div>
      <label class="f">料号</label>
      <div class="suggwrap">
        <input id="partNo" placeholder="输入料号或名称的一部分" autocomplete="off">
        <div class="sugg" id="matSugg"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn small" id="btnScan">扫一扫</button>
        <button class="btn small" id="btnFindMat">查料号</button>
        <button class="btn small" id="btnListMat">从列表选</button>
        <span class="muted" id="matInfo" style="font-size:12px"></span>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn small" id="btnOcr">📷 拍照识别料号</button>
        <button class="btn small" id="btnAsr">🎤 语音转文字</button>
        <input type="file" id="ocrInput" accept="image/*" capture="environment" style="display:none">
      </div>
      <label class="f">采集类型</label>
      <select id="capType"></select>
      <div id="capFields"></div>
      <label class="f">现场照片（可选）</label>
      <div class="row">
        <button class="btn small" id="btnPhoto">拍照留证</button>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
        <span class="muted" id="photoState" style="font-size:12px">未拍照</span>
      </div>
      <div class="photoPrev" id="photoPrev" style="display:none"><img id="photoThumb" alt="现场照片"><span id="photoMeta"></span><button class="btn small" id="btnPhotoDel">删除</button></div>
      <label class="f">备注 / 现场情况</label>
      <textarea id="capNote" rows="2" placeholder="可填写不良描述、批次等"></textarea>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="btnSubmitCap">提交</button></div>
    </div>
    <div class="card">
      <h2>我提交的 <span class="tag" id="capCount">0</span></h2>
      <div id="capList"><div class="empty">暂无</div></div>
    </div>
  </div>

  <!-- 审批 -->
  <div id="tab-approval" style="display:none">
    <div class="card">
      <h2>待我审批 <span class="tag" id="apprTag">—</span></h2>
      <div id="apprList"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <!-- 系统 -->
  <div id="tab-systems" style="display:none">
    <div class="card">
      <h2>各系统 <span class="tag" id="sysTag">—</span></h2>
      <div id="sysList"><div class="empty">检查连接…</div></div>
      <div class="muted" style="font-size:11px;margin-top:6px">状态由服务端实时检查；未接入的系统不会显示假数据。</div>
    </div>
    <div class="card">
      <h2>常用</h2>
      <div class="row">
        <a class="btn small" id="personnelLink" href="/personnel" style="display:none">人事变动</a>
        <a class="btn small" href="/taskhub">待办总表</a>
        <a class="btn small" href="/portal">门户</a>
      </div>
    </div>
  </div>

  <!-- 我的 -->
  <div id="tab-mine" style="display:none">
    <div class="card">
      <h2>账号</h2>
      <div class="dl" id="acctInfo"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn small" onclick="switchAccount()">切换账号</button>
        <button class="btn small" onclick="logout()">退出登录</button>
      </div>
    </div>
    <div class="card">
      <h2>最近登录记录 <span class="tag" id="logCount">0</span></h2>
      <div id="loginList"><div class="empty">加载中…</div></div>
      <div class="muted" style="font-size:11px;margin-top:6px">每次绑定/切换/退出都会记录在本机绑定的手机号下。</div>
    </div>
  </div>
</div>

<div class="nav">
  <button data-tab="todos" class="on"><span class="ico">☑</span>待办</button>
  <button data-tab="capture"><span class="ico">📷</span>采集</button>
  <button data-tab="approval"><span class="ico">✔</span>审批</button>
  <button data-tab="systems"><span class="ico">▦</span>系统</button>
  <button data-tab="mine"><span class="ico">👤</span>我的</button>
</div>

<div class="scan" id="scanModal" style="display:none">
  <div class="box">
    <div class="hd"><span>扫料号条码</span><button class="btn small" id="scanClose">关闭</button></div>
    <video id="scanVideo" playsinline muted></video>
    <div class="tip" id="scanTip">正在启动摄像头…</div>
  </div>
</div>
<div class="sheet" id="editSheet">
  <div class="sheet-box">
    <h3 id="edTitle">编辑 PLM 节点</h3>
    <label class="f">计划日期</label><input type="date" id="edPlan">
    <label class="f">负责人</label><input id="edOwner" placeholder="负责人姓名">
    <label class="f">状态</label>
    <select id="edStatus">
      <option value="PLANNED">已排期</option><option value="IN_PROGRESS">进行中</option><option value="DONE">已完成</option><option value="PENDING">待办</option><option value="FAILED">异常</option>
    </select>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="btnEdSave">保存（同步 PLM）</button><button class="btn" onclick="closeEditSheet()">取消</button></div>
  </div>
</div>
<div class="sheet" id="todoSheet">
  <div class="sheet-box">
    <h3 id="tsTitle">待办明细</h3>
    <div class="dl" id="tsBody"></div>
    <div class="row" id="tsActions" style="margin-top:12px"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ROLE_CAP = { ADMIN: 'ADMIN', GM: 'GM', RD_LEAD: 'RD_LEAD', ENGINEER: 'ENGINEER', PROJECT_MANAGER: 'PROJECT_MANAGER', SALES_MANAGER: 'SALES_MANAGER', SALES: 'SALES', PURCHASE: 'PURCHASE', FINANCE: 'FINANCE', QUALITY: 'QUALITY', HR_MANAGER: 'VIEWER' };
const state = { me: null, demoRole: 'VIEWER', tab: 'todos', todos: null, todoRows: [], todoCat: 'all', hideDone: true, plmMap: {}, caps: [], capTypes: [], capFields: [], materials: [], photo: null, approvals: [] };
const TODO_CATS = [['all', '全部'], ['overdue', '已超期'], ['open', '待处理'], ['meeting', '会议'], ['hub', '总表'], ['done', '已完成']];

function toast(msg) { const t = $('toast'); t.textContent = msg; t.className = 'toast on'; clearTimeout(t._h); t._h = setTimeout(() => { t.className = 'toast'; }, 2400); }
async function api(path, method, body) {
  const r = await fetch(path, { method: method || 'GET', credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch (e) { j = { error: 'HTTP ' + r.status }; }
  if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { status: r.status, body: j });
  return j;
}

async function boot() {
  let me;
  try { me = await api('/api/v1/mobile/me'); } catch (e) { location.replace('/m/login'); return; }
  if (!me.loggedIn) { location.replace('/m/login'); return; }
  state.me = me.user;
  state.demoRole = ROLE_CAP[me.user.role] || 'VIEWER';
  $('who').textContent = me.user.name || me.user.username;
  $('whoSub').textContent = [me.user.position, me.user.dept].filter(Boolean).join(' · ');
  $('acctInfo').innerHTML = [
    ['姓名', me.user.name], ['岗位', me.user.position], ['部门', me.user.dept || '未设置'],
    ['账号', me.user.username], ['手机号', me.user.phone]
  ].map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v || '—')}</b></div>`).join('');
  $('capRoleTag').textContent = '岗位权限：' + state.demoRole;
  loadTodos(); loadCapTypes(); loadCaps(); loadLogins();
  if (canApprove()) loadApprovals(); else hideTab('approval');
  if (isHr()) { const pl = $('personnelLink'); if (pl) pl.style.display = ''; }
}

// 只呈现与本人相关：无审批权限就不显示审批页签
function canApprove() { return ['RD_LEAD', 'ADMIN'].includes(state.me && state.me.role); }
function isHr() {
  const r = state.me && state.me.role;
  return ['ADMIN', 'GM', 'HR_MANAGER', 'hr_manager'].includes(r) || /人事|行政/.test((state.me && state.me.dept) || '');
}
function hideTab(k) {
  const b = document.querySelector('.nav button[data-tab="' + k + '"]');
  if (b) b.style.display = 'none';
  const t = $('tab-' + k);
  if (t) { t.style.display = 'none'; t.dataset.hidden = '1'; }
  if (state.tab === k) switchTab('todos');
}

// 系统总览：各系统连接状态 + 入口（只读；未接入不显示假数据）
const SYSTEMS_META = {
  plm: { label: 'PLM 研发', desc: '项目 / 节点 / 采集 / 审批', href: '/plm2' },
  spc: { label: 'SPC 供应链', desc: '控制塔 / 订单 / 异常 / 供应商', href: '/m/spc' },
  crm: { label: 'CRM 销售', desc: '客户 / 线索 / 商机 / 订单', href: '/m/crm' },
  ebms: { label: 'EBMS 经营', desc: '岗位事项 / 经营结果', href: '/m/ebms' },
  meeting: { label: '会议助手', desc: '会议待办（已并入待办）', href: '/taskhub' },
  hub: { label: 'Hub 智能体', desc: '经营事项 / 收件箱', href: '#' },
  hlc: { label: 'HLC 人事后勤', desc: '报修 / 请假', href: '/hlc' },
  fac: { label: 'FAC 财经', desc: '规划中，未接入', href: '' },
  edp: { label: 'EDP 数据证据', desc: '规划中，未接入', href: '' }
};
async function loadSystems() {
  const box = $('sysList');
  box.innerHTML = '<div class="empty">检查连接…</div>';
  try {
    const d = await api('/api/v1/systems');
    const systems = d.systems || {};
    const role = state.me && state.me.role;
    const SPC_ROLES = ['ADMIN', 'GM', 'PURCHASE', 'SALES_MANAGER', 'SALES', 'PROJECT_MANAGER'];
    const CRM_ROLES = ['ADMIN', 'GM', 'SALES_MANAGER', 'SALES'];
    const HUB_ROLES = ['ADMIN', 'GM'];
    // 只呈现与本人岗位相关、且确实部署了的系统
    const keys = Object.keys(SYSTEMS_META).filter(k => {
      if (k === 'fac' || k === 'edp') return false;
      if (k === 'spc') return SPC_ROLES.includes(role);
      if (k === 'crm') return CRM_ROLES.includes(role);
      if (k === 'hub') return HUB_ROLES.includes(role);
      return true;
    });
    const list = keys.map(k => Object.assign({ key: k }, SYSTEMS_META[k], systems[k] || {}));
    const okCount = list.filter(x => x.ok).length;
    $('sysTag').textContent = okCount + ' / ' + list.length + ' 已连接';
    box.innerHTML = list.map(x => {
      const meta = SYSTEMS_META[x.key];
      const link = meta.href === '#' ? ('http://' + location.hostname + ':8787') : meta.href;
      const chip = x.ok ? '<span class="tag ok">已连接</span>'
        : (x.configured === false ? '<span class="tag">未接入</span>' : '<span class="tag bad">连接失败</span>');
      const detail = x.ok ? '' : `<div class="muted" style="font-size:11px">${esc(x.error || '')}</div>`;
      const btn = (meta.href && x.ok)
        ? `<a class="btn small" href="${link}" ${meta.href === '#' ? 'target="_blank" rel="noopener"' : ''}>打开</a>` : '';
      return `<div class="item"><div class="body"><b>${esc(meta.label)}</b><small>${esc(meta.desc)}</small>${detail}</div>${chip}${btn}</div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`;
  }
}

// 供应链相关岗位在待办页看到一张 SPC 小卡（只读）
const SPC_ROLES = ['ADMIN', 'GM', 'PURCHASE', 'SALES_MANAGER', 'SALES', 'PROJECT_MANAGER'];
async function loadSpcCard() {
  const box = $('spcCard');
  if (!box) return;
  if (!SPC_ROLES.includes(state.me.role)) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = `<div class="card"><h2>供应链 SPC <span class="tag blue">只读</span></h2>
    <div class="kpis"><div class="kpi"><b>…</b><span>读取中</span></div></div>
    <a class="btn small" href="/m/spc">查看订单 / 异常 / 供应商</a></div>`;
  try {
    const d = await api('/api/v1/spc/dashboard');
    const t = (d.parts && d.parts.today && d.parts.today.data) || {};
    box.innerHTML = `<div class="card"><h2>供应链 SPC <span class="tag blue">只读</span></h2>
      <div class="kpis">
        <div class="kpi"><b>${t.yellow_orders == null ? '—' : t.yellow_orders}</b><span>关注订单</span></div>
        <div class="kpi"><b>${t.pending_close_issues == null ? '—' : t.pending_close_issues}</b><span>待关闭异常</span></div>
        <div class="kpi"><b>${t.eta_overdue_po == null ? '—' : t.eta_overdue_po}</b><span>ETA 逾期采购</span></div>
      </div>
      <a class="btn small primary" href="/m/spc">查看明细</a></div>`;
  } catch (e) {
    box.innerHTML = `<div class="card"><h2>供应链 SPC <span class="tag">未连接</span></h2>

/* ---------- 待办 ---------- */
async function loadTodos() {
  const u = state.me; if (!u) return;
  try {
    const t = await api('/api/v1/plm2/me/todos?user=' + (u.personId || 0));
    state.todos = t;
    const m = t.meeting || { items: [] };
    const th = (t.taskhub && t.taskhub.items) || [];
    const plmMap = {};
    try {
      const q = await api('/api/v1/tasks?owner=' + encodeURIComponent(u.name) + '&source=PLM2');
      (q.items || []).forEach(x => { const r = x.refs || {}; if (r.projectNo && r.nodeCode) plmMap[r.projectNo + '|' + r.nodeCode] = x; });
    } catch (e) { /* 总表不可用时只看待办 */ }
    state.plmMap = plmMap;

    const rows = [];
    (t.overdue || []).forEach(r => rows.push({ kind: 'plm', cat: 'overdue', r }));
    (t.todo || []).forEach(r => rows.push({ kind: 'plm', cat: 'open', r }));
    (t.done || []).slice(0, 20).forEach(r => rows.push({ kind: 'plm', cat: 'done', r }));
    (m.items || []).forEach(x => rows.push({ kind: 'meeting', cat: x.category === '已完成' ? 'done' : 'meeting', x }));
    th.forEach(x => rows.push({ kind: 'hub', cat: (x.status === 'done' || x.status === 'cancelled') ? 'done' : 'hub', x }));
    state.todoRows = rows;

    $('todoTag').textContent = u.name;
    $('todoKpis').innerHTML = [
      ['待处理', rows.filter(r => r.cat === 'overdue' || r.cat === 'open').length],
      ['会议', (m.items || []).length],
      ['总表', th.filter(x => x.status !== 'done').length]
    ].map(([l, v]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
    renderCats(); renderTodoList();
  } catch (e) { $('todoList').innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`; }
}
function renderCats() {
  const rows = state.todoRows || []; const cur = state.todoCat || 'all';
  $('todoCats').innerHTML = TODO_CATS.map(([k, l]) => {
    const n = k === 'all' ? rows.length : rows.filter(r => r.cat === k).length;
    return `<button class="chipbtn ${cur === k ? 'on' : ''}" onclick="setCat('${k}')">${l}${n ? ' ' + n : ''}</button>`;
  }).join('') + `<label class="muted" style="display:inline-flex;gap:5px;align-items:center;font-size:12px;margin-left:auto"><input type="checkbox" id="chkHideDone" ${state.hideDone ? 'checked' : ''} onchange="setHideDone(this.checked)">隐藏已完成</label>`;
}
window.setHideDone = (v) => { state.hideDone = v; renderTodoList(); };
window.setCat = (k) => { state.todoCat = k; renderCats(); renderTodoList(); };
function actions(r) {
  if (r.kind === 'plm') {
    const item = (state.plmMap || {})[r.r.projectNo + '|' + r.r.nodeCode];
    if (!item) return '<span class="muted" style="font-size:11px">去 PLM</span>';
    if (item.status === 'done') return '<span class="tag ok">已完成</span>';
    return `<button class="btn small" onclick="todoAct('${item.id}','in_progress')">开始</button><button class="btn small primary" onclick="todoAct('${item.id}','done')">完成</button>`;
  }
  if (r.kind === 'hub') return r.x.status === 'done' ? '<span class="tag ok">已完成</span>' : `<button class="btn small primary" onclick="todoAct('${r.x.id}','done')">完成</button>`;
  return '<span class="tag">会议助手</span>';
}
function renderTodoList() {
  const rows = state.todoRows || []; const cat = state.todoCat || 'all';
  let list = rows.filter(r => cat === 'all' ? true : r.cat === cat);
  if (state.hideDone && cat !== 'done') list = list.filter(r => r.cat !== 'done');
  if (!list.length) { $('todoList').innerHTML = '<div class="empty">这个分类下暂时没有待办</div>'; return; }
  $('todoList').innerHTML = list.slice(0, 60).map((r, i) => {
    const idx = state.todoRows.indexOf(r);
    if (r.kind === 'plm') {
      return `<div class="item" onclick="openTodoDetail(${idx})"><span class="tag ${r.cat === 'overdue' ? 'bad' : (r.cat === 'done' ? 'ok' : 'blue')}">${r.cat === 'overdue' ? '已超期' : (r.cat === 'done' ? '已完成' : '待处理')}</span>
        <div class="body"><b>${esc(r.r.nodeName)}</b><small>${esc(r.r.projectNo)} · 计划 ${esc(r.r.planDate || '未排期')}</small></div><span onclick="event.stopPropagation()">${actions(r)}</span></div>`;
    }
    if (r.kind === 'meeting') {
      return `<div class="item" onclick="openTodoDetail(${idx})"><span class="tag ${xchk(r.x.category)}">${esc(r.x.category)}</span>
        <div class="body"><b>${esc(r.x.title)}</b><small>${esc(r.x.due || '无截止')} · 会议助手</small></div><span onclick="event.stopPropagation()">${actions(r)}</span></div>`;
    }
    const x = r.x;
    return `<div class="item" onclick="openTodoDetail(${idx})"><span class="tag ${x.status === 'done' ? 'ok' : (x.status === 'overdue' ? 'bad' : 'blue')}">${esc(x.statusText || x.status)}</span>
      <div class="body"><b>${esc(x.title)}</b><small>${esc(x.due || '无截止')} · 待办总表</small></div><span onclick="event.stopPropagation()">${actions(r)}</span></div>`;
  }).join('') + (list.length > 60 ? '<div class="empty">已显示前 60 条，可用分类缩小范围</div>' : '');
}
function xchk(c) { return c === '已完成' ? 'ok' : (c === '逾期' || c === '异常' ? 'bad' : 'blue'); }
window.todoAct = async (id, status) => {
  try { await api('/api/v1/tasks/' + encodeURIComponent(id) + '/progress', 'POST', { status, actor: state.me.name }); toast(status === 'done' ? '已完成' : '已开始'); loadTodos(); }

// AI 录入工具（找回 8002 端口：OCR 识别料号 / 语音转文字；引擎未装权重时为模拟并如实标注）
const AI_HOST = 'http://' + location.hostname + ':8002';
$('btnOcr').onclick = () => $('ocrInput').click();
$('ocrInput').onchange = async () => {
  const f = $('ocrInput').files && $('ocrInput').files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  try {
    const r = await fetch(AI_HOST + '/ocr', { method: 'POST', body: fd });
    const j = await r.json();
    const txt = String(j.text || j.result || '').trim();
    if (txt) {
      const m = txt.match(/HJ[A-Z0-9]{6,}/i);
      $('partNo').value = m ? m[0] : txt.split(/\s+/)[0];
      toast('OCR 识别：' + txt.slice(0, 30) + (j.engine === 'mock' ? '（模拟）' : ''));
      $('btnFindMat').click();
    } else toast('未识别到文字');
  } catch (e) { toast('OCR 服务不可用（:8002）：' + e.message); }
};
let rec = null, chunks = [];
$('btnAsr').onclick = async () => {
  if (rec) { rec.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(st); chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => {
      $('btnAsr').textContent = '🎤 语音转文字';
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const fd = new FormData(); fd.append('file', blob, 'voice.webm');
      try {
        const r = await fetch(AI_HOST + '/asr', { method: 'POST', body: fd });
        const j = await r.json();
        const txt = String(j.text || j.result || '').trim();
        if (txt) { $('capNote').value = ($('capNote').value ? $('capNote').value + ' ' : '') + txt; toast('语音已转文字' + (j.engine === 'mock' ? '（模拟）' : '')); }
        else toast('未识别到语音');
      } catch (e) { toast('ASR 服务不可用（:8002）：' + e.message); }
      st.getTracks().forEach(t => t.stop()); rec = null;
    };
    rec.start(); $('btnAsr').textContent = '⏹ 停止录音';
  } catch (e) { toast('麦克风不可用：' + e.message); }
};

async function ensureMaterials() {

$('partNo').addEventListener('input', async () => {

/* ---------- 扫码 / 拍照 ---------- */
let scanStream = null, scanTimer = null;
async function openScan() {
  $('scanModal').style.display = 'flex';
  $('scanTip').textContent = '正在启动摄像头…';
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    $('scanVideo').srcObject = scanStream; await $('scanVideo').play();
  } catch (e) { $('scanTip').textContent = '打不开摄像头：可以手动输入料号'; return; }
  if (!('BarcodeDetector' in window)) { $('scanTip').textContent = '本浏览器不支持自动识别，请手动输入料号（建议用 Chrome/Edge 手机版）'; return; }
  let detector; try { detector = new window.BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'itf', 'qr_code'] }); } catch (e) { detector = new window.BarcodeDetector(); }
  $('scanTip').textContent = '把料号条码对准取景框…';
  scanTimer = setInterval(async () => {
    try {
      const codes = await detector.detect($('scanVideo'));
      if (codes && codes.length && codes[0].rawValue) {
        $('partNo').value = codes[0].rawValue.trim(); closeScan(); toast('已识别'); $('btnFindMat').click();
      }
    } catch (e) { /* ignore */ }
  }, 350);
}
function closeScan() {
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  $('scanVideo').srcObject = null; $('scanModal').style.display = 'none';
}
$('btnScan').onclick = openScan;
$('scanClose').onclick = closeScan;
$('scanModal').addEventListener('click', (e) => { if (e.target === $('scanModal')) closeScan(); });

$('btnPhoto').onclick = () => $('photoInput').click();
$('photoInput').onchange = () => {
  const file = $('photoInput').files && $('photoInput').files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      state.photo = { kind: 'photo', name: file.name || '现场照片', takenAt: new Date().toISOString(), dataUrl: cv.toDataURL('image/jpeg', 0.7) };
      $('photoThumb').src = state.photo.dataUrl;
      $('photoMeta').textContent = state.photo.takenAt.slice(11, 16) + ' 已拍 1 张';
      $('photoPrev').style.display = 'flex'; $('photoState').textContent = '已附 1 张照片';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};

    $('logCount').textContent = list.length;
    $('loginList').innerHTML = list.map(x => `<div class="item">
      <span class="tag ${x.ok ? 'ok' : 'bad'}">${x.kind === 'bind' ? '绑定' : x.kind === 'switch' ? '换号' : x.kind === 'logout' ? '退出' : '登录'}</span>
      <div class="body"><b>${esc(x.name || x.username || '')}</b><small>${esc((x.at || '').slice(0, 16).replace('T', ' '))}${x.ok ? '' : ' · ' + esc(x.error || '未通过')}</small></div></div>`).join('') || '<div class="empty">暂无记录</div>';
  } catch (e) { $('loginList').innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`; }
}
window.logout = async () => {
  try { await api('/api/v1/mobile/logout', 'POST', {}); } catch (e) { /* ignore */ }
  location.replace('/m/login');
};
window.switchAccount = () => { window.logout(); };

/* ---------- 导航 ---------- */
function switchTab(k) {
  state.tab = k;
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.getAttribute('data-tab') === k));
  ['todos', 'capture', 'approval', 'systems', 'mine'].forEach(t => { $('tab-' + t).style.display = t === k ? 'block' : 'none'; });
  if (k === 'todos') loadTodos();
  if (k === 'capture') { ensureMaterials().catch(() => {}); loadCaps(); }
  if (k === 'approval') loadApprovals();
  if (k === 'systems') loadSystems();
  if (k === 'mine') loadLogins();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.nav button').forEach(b => { b.onclick = () => switchTab(b.getAttribute('data-tab')); });

boot();
</script>
</body>
</html>
