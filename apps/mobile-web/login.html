<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fbd">
<title>登录 · AEOS</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--line:#dfe7f2;--text:#16283f;--muted:#7186a0;--blue:#2f6fbd;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 34px rgba(15,39,68,.08)}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#2f6fbd,#4a9be0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(47,111,189,.26)}
h1{font-size:19px;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid #d5dfec;border-radius:11px;outline:none}
input:focus{border-color:#8fb8e8;box-shadow:0 0 0 3px rgba(47,111,189,.12)}
button{width:100%;font:inherit;font-size:15px;padding:13px;border-radius:11px;border:1px solid var(--blue);background:var(--blue);color:#fff;margin-top:18px;cursor:pointer}
button[disabled]{opacity:.55}
.err{display:none;background:#fdf1f0;border:1px solid #f0c9c4;color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:14px}
.hint{color:var(--muted);font-size:11px;line-height:1.8;margin-top:14px}
.switch{display:block;text-align:center;color:var(--blue);font-size:12px;margin-top:14px;cursor:pointer;text-decoration:none}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">AE</div>
  <h1 id="title">账号登录</h1>
  <div class="sub" id="sub">手机号或 PLM 账号都可以登录</div>
  <form id="form">
    <!-- 登录模式 -->
    <div id="loginMode">
      <label for="account">账号 / 手机号</label>
      <input id="account" name="account" placeholder="手机号 或 PLM 账号" autocomplete="username">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="PLM 登录密码" autocomplete="current-password">
      <button id="submit" type="submit">登录</button>
    </div>
    <!-- 绑定模式 -->
    <div id="bindMode" class="hidden">
      <label for="bPhone">手机号</label>
      <input id="bPhone" name="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="tel">
      <label for="bUsername">PLM 账号</label>
      <input id="bUsername" name="username" placeholder="例如 admin" autocomplete="username">
      <label for="bPassword">PLM 密码</label>
      <input id="bPassword" name="password" type="password" placeholder="PLM 登录密码" autocomplete="current-password">
      <button id="bindSubmit" type="submit">绑定并进入</button>
    </div>
    <div class="err" id="err"></div>
  </form>
  <a class="switch" id="switch">首次使用？绑定手机号</a>
  <div class="hint" id="hint">绑定后，以后用<b>手机号</b>或<b>账号</b>加密码即可登录，无需重复绑定。换账号：在「我的」里退出后重新绑定。</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let mode = 'login';
function showMode(m) {
  mode = m;
  const login = m === 'login';
  $('loginMode').classList.toggle('hidden', !login);
  $('bindMode').classList.toggle('hidden', login);
  $('title').textContent = login ? '账号登录' : '手机绑定';
  $('sub').textContent = login ? '手机号或 PLM 账号都可以登录' : '第一次用手机号绑定 PLM 账号，以后自动进入';
  $('switch').textContent = login ? '首次使用？绑定手机号' : '已有绑定？返回登录';
  hideErr();
}
function hideErr() { $('err').style.display = 'none'; }
function showErr(msg) { const e = $('err'); e.textContent = msg; e.style.display = 'block'; }
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch (e) { j = { error: 'HTTP ' + r.status }; }
  if (!r.ok) throw Object.assign(new Error(j.error || '请求失败'), { status: r.status, body: j });
  return j;
}
(async () => {
  try {
    const r = await fetch('/api/v1/mobile/me', { credentials: 'same-origin' });
    const j = await r.json();
    if (j.loggedIn) location.replace('/m');
  } catch (e) { /* 未登录 */ }
})();
$('switch').onclick = () => { showMode(mode === 'login' ? 'bind' : 'login'); };
$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  hideErr();
  if (mode === 'login') {
    const account = $('account').value.trim();
    const password = $('password').value;
    if (!account || !password) { showErr('请输入账号/手机号和密码'); return; }
    const btn = $('submit'); btn.disabled = true; btn.textContent = '正在登录…';
    try {
      await post('/api/v1/mobile/login', { account, password });
      location.replace('/m');
    } catch (e) {
      if (e.status === 404 && e.body && e.body.needBind) {
        $('bPhone').value = e.body.phone || account;
        $('bUsername').value = '';
        showMode('bind');
        showErr('该手机号尚未绑定，请补全账号后绑定');
      } else {
        showErr(e.message);
      }
      btn.disabled = false; btn.textContent = '登录';
    }
    return;
  }
  // 绑定模式
  const phone = $('bPhone').value.trim();
  const username = $('bUsername').value.trim();
  const password = $('bPassword').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) { showErr('请输入正确的 11 位手机号'); return; }
  if (!username || !password) { showErr('请输入 PLM 账号和密码'); return; }
  const btn = $('bindSubmit'); btn.disabled = true; btn.textContent = '正在绑定…';
  try {
    await post('/api/v1/mobile/bind', { phone, username, password });
    location.replace('/m');
  } catch (e) {
    showErr(e.message);
    btn.disabled = false; btn.textContent = '绑定并进入';
  }
};
</script>
</body>
</html>
