<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEOS POMS M10 · 双端岗位生成 L0</title>
<style>:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1b2c40;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1280px;margin:auto;min-height:100vh;display:grid;grid-template-columns:238px 1fr}.nav{background:#122a49;color:white;padding:24px}.nav button{display:block;width:100%;margin:12px 0;background:#244769;color:white}.main{padding:24px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:3px 0}small,.muted{opacity:.7}button,select,input,textarea{font:inherit;border:1px solid #d5dfec;border-radius:10px;padding:11px;background:white}button{cursor:pointer}button.primary{background:#256db4;color:white;border-color:#256db4}button.active{outline:2px solid #83b9ef}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:20px;background:white;border:1px solid #e1e7f0;border-radius:16px;margin:16px 0}.panel h2{font-size:17px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}label{display:block;margin:12px 0}input,textarea,select{max-width:100%;width:100%}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border-radius:24px;background:#eff5ff;padding:8px 12px}.task{padding:12px 0;border-bottom:1px solid #e5e9ef}.task:last-child{border:0}.foot{display:none}.notice{background:#fff8e5;border:1px solid #f1d793;padding:12px;border-radius:10px}@media(max-width:760px){.app{display:block;padding-bottom:72px}.nav{display:none}.main{padding:12px}.cols{grid-template-columns:1fr}.foot{display:flex;position:fixed;bottom:0;background:white;box-shadow:0 -2px 12px #0001;left:0;right:0;justify-content:space-around;padding:8px}.foot button{padding:10px;font-size:13px}}</style>
<div class="app"><aside class="nav"><b>AEOS · M10 POMS</b><p>统一个人微系统</p><button onclick="show('tasks')">未来待办</button><button onclick="show('roles')">岗位生成</button><button onclick="show('results')">过去结果</button><button onclick="show('agent')">我的智能体</button><p class="muted">L0 Mock · 未接入生产系统</p></aside><main class="main"><div class="header"><div><small>AEOS / 岗位自适应平台</small><h1>M10 全岗位微系统</h1></div><div class="row"><button onclick="view('web')" id="vweb">网页版</button><button onclick="view('mobile')" id="vmobile">手机版</button></div></div><div class="notice">演示数据。岗位、任务及智能体均为本地模拟，M04 PLM 接口尚未连接。</div><section class="panel"><div class="cols"><label>所属中心<select id="domain"><option value="M04">M04 研发</option><option value="M05">M05 销售</option><option value="M06">交付</option><option value="M07">人事行政</option><option value="M08">品控</option><option value="M09">财经</option><option value="M14">系统研发</option><option value="CUSTOM">自定义</option></select></label><label>当前岗位<select id="role" onchange="render()"><option value="研发工程师">研发工程师</option><option value="销售专员">销售专员</option></select></label></div></section><section id="tasks" class="panel"><h2>未来待办</h2><div id="tasklist"></div><h2>当前岗位能力包</h2><div id="chosen" class="chips"></div><p><button class="primary" onclick="show('roles')">新增岗位 / 调整能力</button></p></section><section id="roles" class="panel" hidden><h2>新建任意岗位微系统</h2><label>岗位名称<input id="name" placeholder="例如：结构工程师、客户开发专员"/></label><label>岗位职责<textarea id="duties" rows="4" placeholder="描述岗位负责的流程、工作任务和业务对象"></textarea></label><p><button onclick="recommend()">根据职责推荐能力包</button></p><h2>选择能力包</h2><div id="packs"></div><p><button class="primary" onclick="createRole()">生成岗位微系统</button></p></section><section id="results" class="panel" hidden><h2>过去结果</h2><p>声明完成 ≠ 验证通过，以下为本地模拟数据。</p><div id="records"></div></section><section id="agent" class="panel" hidden><h2>岗位主智能体</h2><p id="agenttitle">岗位主 Agent（模拟）</p><textarea id="q" rows="3" placeholder="输入问题（不会发送到真实 Hub）"></textarea><p><button onclick="reply()">打开并模拟问答</button></p><div id="answer"></div></section></main></div><nav class="foot"><button onclick="show('tasks')">待办</button><button onclick="show('roles')">岗位</button><button onclick="show('results')">结果</button><button onclick="show('agent')">智能体</button></nav>
<script>
const registry=[['rd-design','结构设计与图纸','设计 结构 图纸 研发'],['bom','BOM与物料','BOM 物料 零件'],['ecn','ECN工程变更','变更 ECN ECO'],['rd-test','样品验证','样品 测试 检验'],['lead','公开线索开发','获客 客户 开发 搜索'],['quote','询盘与报价','询盘 报价 商务'],['delivery','生产与交付','交付 出货 生产'],['finance','应收回款','回款 财务 应收'],['quality','品质检验','质量 品质 检验'],['hr','人事行政','人事 招聘 行政'],['nomi','软件研发','软件 代码 系统']].map(([id,name,keywords])=>({id,name,keywords:keywords.split(' ')}));
const roles={'研发工程师':{domain:'M04',duties:'结构设计 BOM 研发',packs:['rd-design','bom']},'销售专员':{domain:'M05',duties:'客户开发 询盘 报价 交付 回款',packs:['lead','quote','delivery','finance']}};
const records=[];let suggested=[];
function show(id){for(const x of ['tasks','roles','results','agent'])document.getElementById(x).hidden=x!==id;if(id==='results')drawRecords()}
function view(mode){document.body.style.maxWidth=mode==='mobile'?'430px':'';document.body.style.margin='auto';document.getElementById('vweb').className=mode==='web'?'active':'';document.getElementById('vmobile').className=mode==='mobile'?'active':''}
function render(){const r=roles[document.getElementById('role').value];document.getElementById('domain').value=r.domain;const names=r.packs.map(id=>registry.find(p=>p.id===id)?.name||id);document.getElementById('chosen').replaceChildren(...names.map(n=>{let d=document.createElement('span');d.className='chip';d.textContent=n;return d}));const el=document.getElementById('tasklist');el.replaceChildren();names.forEach((n,i)=>{let d=document.createElement('div');d.className='task';let title=document.createElement('span');title.textContent='核查 '+n+' 的当前业务对象与待办';let b=document.createElement('button');b.textContent='声明完成';b.style.marginLeft='12px';b.onclick=()=>{records.unshift({name:n,role:document.getElementById('role').value});b.disabled=true;b.textContent='待验证'};d.append(title,b);el.append(d)});document.getElementById('agenttitle').textContent=document.getElementById('role').value+' 主 Agent（本地模拟）'}
function recommend(){const text=document.getElementById('duties').value.toLowerCase();suggested=registry.filter(p=>p.keywords.some(k=>text.includes(k.toLowerCase()))).map(p=>p.id);drawPacks()}
function drawPacks(){const el=document.getElementById('packs');el.replaceChildren();registry.forEach(p=>{const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.style.width='auto';box.value=p.id;box.checked=suggested.includes(p.id);label.append(box,document.createTextNode(' '+p.name));el.append(label)})}
function createRole(){const name=document.getElementById('name').value.trim(),duties=document.getElementById('duties').value.trim();if(!name||!duties){alert('请输入岗位名称与职责');return}const packs=[...document.querySelectorAll('#packs input:checked')].map(x=>x.value);roles[name]={domain:document.getElementById('domain').value,duties,packs};const select=document.getElementById('role');if(![...select.options].some(x=>x.value===name)){const op=document.createElement('option');op.value=op.textContent=name;select.add(op)}select.value=name;render();show('tasks')}
function drawRecords(){const el=document.getElementById('records');el.replaceChildren();records.forEach(r=>{let d=document.createElement('div');d.className='task';d.textContent=r.role+' · '+r.name+' · 已声明完成 / 待验证';el.append(d)})}
function reply(){document.getElementById('answer').textContent='模拟建议：请检查任务来源、业务对象、版本和证据，涉及审批应走专业自治中心与 Guard；未调用 AI Hub。'}
drawPacks();render();
</script></html>
