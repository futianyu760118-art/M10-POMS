<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>待办总表 · 一处看全部待办</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--line:#e3e8ef;--text:#1f2937;--muted:#6b7280;--blue:#2563eb;--red:#d64545;--green:#15803d;--orange:#b45309}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.head{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.head h1{font-size:17px;margin:0}
.head .sub{font-size:11px;color:var(--muted)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:#c7d2e0;background:#fafcff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.small{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;background:#fff}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid var(--line);background:#f8fafc;color:var(--muted);white-space:nowrap}
.tag.red{background:#fef2f2;border-color:#f5cccc;color:#b42318}
.tag.green{background:#f0fdf4;border-color:#bbe7c8;color:var(--green)}
.tag.blue{background:#eff6ff;border-color:#c7ddff;color:#1d4ed8}
.tag.orange{background:#fffbeb;border-color:#f5e0b7;color:var(--orange)}
.tag.gray{background:#f3f4f6;border-color:#e5e7eb;color:#4b5563}
.item{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #f1f4f8;cursor:default}
.item:last-child{border-bottom:0}
.item:hover{background:#fafcff}
.it-body{flex:1;min-width:0}
.it-body b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-body small{color:var(--muted);font-size:11px}
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #f1f4f8}
th{font-size:11px;color:var(--muted);font-weight:600;background:#fbfcfe}
.notice{border:1px solid var(--line);border-left:4px solid var(--blue);background:#f7faff;border-radius:8px;padding:9px 12px;font-size:12px;color:#334155;margin-bottom:12px}
.notice.warn{border-left-color:var(--orange);background:#fffbf3;color:#8a5a12}
.muted{color:var(--muted)}
.cand{border:1px solid #f0e3c8;background:#fffdf7;border-radius:8px;padding:9px 11px;margin-bottom:8px}
.cand b{font-size:13px}
.cand .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.empty{padding:14px 4px;color:var(--muted);font-size:12px}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:420px}
.toast.show{opacity:1}
.health{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.health .h{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.bad{background:var(--red)}
/* 多选下拉 */
.ms{position:relative}
.ms-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;min-width:118px;text-align:left}
.ms-btn.on{border-color:var(--blue);color:#1d4ed8;background:#eff6ff}
.ms-menu{position:absolute;top:calc(100% + 4px);left:0;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:6px;display:none;z-index:30;max-height:280px;overflow:auto}
.ms.open .ms-menu{display:block}
.ms-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.ms-item:hover{background:#f5f8ff}
.ms-item input{cursor:pointer}
.ms-foot{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:5px;padding-top:6px}
/* KPI 看明细 */
.kpi{cursor:pointer;transition:.15s;position:relative}
.kpi:hover{border-color:#c7d2e0;box-shadow:0 2px 8px rgba(37,99,235,.08);transform:translateY(-1px)}
.kpi.active{border-color:var(--blue);background:#f5f9ff;box-shadow:inset 0 0 0 1px var(--blue)}
.kpi.active:after{content:"已看明细";position:absolute;right:8px;top:6px;font-size:10px;color:var(--blue)}
.kpi .drill{position:absolute;right:8px;bottom:6px;font-size:10px;color:#9aa7b8}
/* 筛选条件 chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#eef4ff;border:1px solid #cfdffb;color:#1d4ed8;border-radius:20px;padding:1px 9px;font-size:12px}
.chip b{font-weight:600}
.chip i{cursor:pointer;font-style:normal;opacity:.7}
.chip i:hover{opacity:1}
/* 合并重复分组 */
.grp{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff;overflow:hidden}
.grp[open]{border-color:#cfdffb}
.grp summary{list-style:none;cursor:pointer;padding:9px 11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grp summary::-webkit-details-marker{display:none}
.grp summary:hover{background:#fafcff}
.grp .cnt{border-radius:20px;background:#eef2ff;border:1px solid #d7dffb;color:#3730a3;font-size:11px;padding:1px 8px;white-space:nowrap}
.grp .cnt.one{background:#f8fafc;border-color:var(--line);color:var(--muted)}
.grp .title{flex:1;min-width:220px;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .occ{border-top:1px solid #f1f4f8;background:#fcfdff}
.grp .occ .item{padding:7px 11px}
/* 看板 */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;align-items:start;padding-bottom:6px}
.bcol{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;overflow:hidden}
.bcard[open]{border-color:#cfdffb}
.bcard summary{list-style:none;cursor:pointer;padding:8px 9px;display:flex;flex-direction:column;gap:4px}
.bcard summary::-webkit-details-marker{display:none}
.bcard summary:hover{background:#fafcff}
.bcard .btitle{font-size:12px;font-weight:600;line-height:1.35}
.bcard .cnt{align-self:flex-start}
.bcard .occ{border-top:1px solid #f1f4f8;background:#fcfdff}
.bcard .occ .item{padding:7px 9px}
/* 表格内展开 */
table .cnt{margin-left:4px}
/* 逐层查看 + 明细 */
.cstep{cursor:pointer;color:#1d4ed8;border-bottom:1px dashed #9cc2ea;padding:0 2px}
.cstep:hover{background:#eef5fd}
.taskDetail{position:fixed;inset:0;background:rgba(10,20,35,.5);display:none;z-index:70;align-items:flex-end;justify-content:center}
.taskDetail.open{display:flex}
.td-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:82vh;overflow:auto;padding:16px;box-shadow:0 -8px 30px rgba(15,39,68,.2)}
.td-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px;font-weight:600}
.dl>div{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid #f1f5fa}
.dl span{width:92px;color:var(--muted);flex:none}
.dl b{font-weight:600;word-break:break-all}
.dsec{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.drefs{background:#0f2744;color:#d7e6f5;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;word-break:break-all}
</style>
</head>
<body>
<div class="head">
  <div>
    <h1>待办总表</h1>
    <div class="sub">各系统的待办都汇总到这里 · 行政类来自会议助手，业务类来自 PLM · <span id="upd">未加载</span></div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnPlmSync" title="从 PLM 取回最新进度，更新这张总表">同步 PLM</button>
  <button class="btn" id="btnExtract">自动拆分文本</button>
  <button class="btn primary" id="btnRefresh">刷新汇总</button>
  <a class="btn" href="/portal">返回门户</a>
</div>
<div class="wrap">
  <div class="notice warn" id="notice">
    这里是<b>各系统待办的汇总表</b>，只用来查看，不在本系统里改动业务数据；<b>做完还要有人验收</b>，状态变化请到原来的系统操作。下面的自动拆分是按文字规则拆的（不是 AI 大模型），拆出来的每一条都要由有权限的管理员点确认，才会加到这张表里。
  </div>
  <div class="health" id="health"></div>
  <div class="kpis" id="kpis" style="margin-top:12px"></div>

  <div class="panel">
    <div class="filters" style="margin-bottom:8px">
      <span class="muted" style="font-size:12px">查看范围</span>
      <button class="btn small" id="viewHub" onclick="setView('hub')">总库</button>
      <button class="btn small" id="viewPerson" onclick="setView('person')">个人待办</button>
      <button class="btn small" id="viewDept" onclick="setView('dept')">部门待办</button>
      <span id="viewExtra" class="filters" style="gap:6px"></span>
      <span class="spacer" style="flex:1"></span>
      <span class="muted" id="syncState" style="font-size:11px">自动更新：正在连接…</span>
    </div>
    <div class="filters">
      <select id="fOwner"><option value="">全部负责人</option></select>
      <select id="fDomain"><option value="">全部业务</option></select>
      <select id="fSource"><option value="">全部来源</option></select>
      <div class="ms" id="msStatus">
        <button type="button" class="ms-btn" id="msStatusBtn">全部状态</button>
        <div class="ms-menu" id="msStatusMenu"></div>
      </div>
      <input id="fQ" placeholder="搜索待办 / 项目 / 负责人" style="flex:1;min-width:180px">
      <label class="muted" style="display:flex;gap:6px;align-items:center;font-size:12px;white-space:nowrap">
        <input type="checkbox" id="fGroup" checked> 相同事项合并
      </label>
      <button class="btn small" id="btnClear">清空</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="cols">
    <div>
      <div class="panel">
        <h2>任务清单 <span class="tag" id="listCount">0</span> <span class="muted" style="font-size:11px;font-weight:400">点上面的数字看明细 · 点标题展开 · 相同事项可合并</span></h2>
        <div class="filters" style="gap:6px;margin-bottom:8px">
          <span class="muted" style="font-size:12px">显示方式</span>
          <button class="btn small" id="modeList" onclick="setMode('list')">列表</button>
          <button class="btn small" id="modeBoard" onclick="setMode('board')">看板</button>
          <button class="btn small" id="modeTable" onclick="setMode('table')">表格</button>
          <span class="muted" id="modeHint" style="font-size:11px"></span>
        </div>
        <div id="list"></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>按负责人查看 <span class="tag" id="ownerCount">0 人</span></h2>
        <div id="owners"></div>
      </div>
      <div class="panel">
        <h2>待确认（自动拆出来的） <span class="tag orange" id="candCount">0</span></h2>
        <div style="margin-bottom:8px">
          <textarea id="fText" placeholder="把会议记录、微信通知或口头交代粘贴到这里，系统会自动拆成一条条待办（例：补充试模照片；通知采购准备来料检验 2026-11-20）" style="width:100%;min-height:64px;border:1px solid var(--line);border-radius:7px;padding:8px;font:13px/1.5 inherit;resize:vertical"></textarea>
          <button class="btn small primary" id="btnExtractText" style="margin-top:6px">自动拆分</button>
        </div>
        <div class="filters" style="margin-bottom:8px">
          <input id="fReviewer" placeholder="确认人（有权限的管理员）" list="reviewers" style="flex:1" value="">
          <datalist id="reviewers"></datalist>
        </div>
        <div id="cands"><div class="empty">暂无待确认的内容</div></div>
      </div>
    </div>
  </div>
</div>
<div class="taskDetail" id="taskDetail">
  <div class="td-box">
    <div class="td-head"><span>任务明细</span><button class="btn small" onclick="closeTask()">关闭</button></div>
    <div id="detailBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { data: null, cands: [], people: [], drill: [], group: true, mode: (localStorage.getItem('taskhub-mode') || 'list'), view: 'hub', person: '', dept: '', deptData: null, filters: { owner: '', domain: '', source: '', statuses: [], q: '' } };
const ST_TAG = { overdue: 'red', blocked: 'red', pending: 'blue', in_progress: 'orange', confirmed: 'blue', candidate: 'gray', done: 'green', cancelled: 'gray' };
const ST_TEXT = { overdue: '已超期', blocked: '有问题', pending: '待办', in_progress: '处理中', confirmed: '已受理', candidate: '待确认', done: '已完成', cancelled: '已作废' };
const DOM_TAG = { ADMIN: 'blue', RD: 'gray', PRODUCTION: 'orange', PURCHASE: 'orange', ORDER: 'green', OPS: 'blue' };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }
async function api(path, method, body) {
  const r = await fetch(path, { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch (e) { j = { error: 'HTTP ' + r.status }; }
  if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { status: r.status, body: j });
  return j;
}

function reviewer() { return ($('fReviewer').value || '').trim(); }

function filtered() {
  const d = state.data; if (!d) return [];
  const f = state.filters;
  const st = f.statuses || [];
  const source = state.view === 'dept' && state.deptData ? (state.deptData.items || []) : d.items;
  const owner = state.view === 'person' ? state.person : f.owner;
  return source.filter(x =>
    (!owner || x.ownerName === owner) &&
    (!f.domain || x.bizDomain === f.domain) &&
    (!f.source || x.source === f.source) &&
    (!st.length || st.includes(x.status)) &&
    (!f.q || (x.title + (x.detail || '') + x.ownerName).toLowerCase().includes(f.q.toLowerCase()))
  );
}

// 重复合并键：标题归一（去空白/尾部标点/全角符号差异）
function normTitle(t) {
  return String(t || '')
    .replace(/[\s\u3000]+/g, '')
    .replace(/[（(]\s*[)）]/g, '')
    .replace(/[·•\.。；;，,、:：!！\?？\-—_~～]+$/g, '')
    .toLowerCase();
}

function groupRows(rows) {
  const map = new Map();
  rows.forEach(x => {
    const k = normTitle(x.title) || ('#' + x.id);
    if (!map.has(k)) map.set(k, { key: k, title: x.title, items: [] });
    map.get(k).items.push(x);
  });
  return [...map.values()].map(g => {
    const owners = [...new Set(g.items.map(i => i.ownerName || '未分配'))];
    const st = {};
    g.items.forEach(i => { st[i.status] = (st[i.status] || 0) + 1; });
    const dues = g.items.map(i => i.due).filter(Boolean).sort();
    const doms = {};
    g.items.forEach(i => { doms[i.bizDomain] = (doms[i.bizDomain] || 0) + 1; });
    const dom = Object.keys(doms).sort((a, b) => doms[b] - doms[a])[0];
    return Object.assign(g, { count: g.items.length, owners, statusCounts: st, earliestDue: dues[0] || null, bizDomain: dom });
  }).sort((a, b) => (b.count - a.count) || String(a.earliestDue || '9999').localeCompare(String(b.earliestDue || '9999')));
}

function renderKpis() {
  const d = state.data; const st = (d.counts && d.counts.byStatus) || {};
  const f = state.filters;
  const cards = [
    ['总任务', d.total, '', 'all'],
    ['逾期', st.overdue || 0, 'red', 'overdue'], ['待办', st.pending || 0, 'blue', 'pending'],
    ['进行中', st.in_progress || 0, 'orange', 'in_progress'], ['异常', st.blocked || 0, 'red', 'blocked'],
    ['已完成', st.done || 0, 'green', 'done']
  ];
  if (st.confirmed) cards.push(['已确认', st.confirmed, 'blue', 'confirmed']);
  if (st.candidate) cards.push(['待确认内容', st.candidate, 'gray', 'candidate']);
  if (st.cancelled) cards.push(['已取消', st.cancelled, 'gray', 'cancelled']);
  const doms = (d.counts && d.counts.byDomain) || {};
  const domCards = Object.keys(doms).map(k => {
    const dd = (d.domains || []).find(x => x.code === k) || {};
    return [esc(dd.label || k) + ' · ' + esc(dd.bizSysLabel || ''), doms[k], 'domain', k];
  });
  const html = cards.map(([l, v, , key]) => {
    const on = key === 'all' ? (!f.owner && !f.domain && !f.source && !(f.statuses || []).length && !f.q) : (key && ((f.statuses || []).length === 1 && f.statuses[0] === key));
    return `<div class="kpi ${on ? 'active' : ''}" onclick="drill('status','${key}')" title="点一下只看这个状态的待办"><b>${v}</b><span>${l}</span><em class="drill">▸</em></div>`;
  }).join('') + domCards.map(([l, v, , key]) => {
    const on = f.domain === key;
    return `<div class="kpi ${on ? 'active' : ''}" onclick="drill('domain','${key}')" title="点一下只看这个业务"><b>${v}</b><span>${l}</span><em class="drill">▸</em></div>`;
  }).join('');
  $('kpis').innerHTML = html;
}

function renderChips() {
  const f = state.filters; const parts = [];
  const trail = state.drill || [];
  if (trail.length) {
    const sep = '<span class="muted" style="margin:0 2px">›</span>';
    const steps = ['<span class="cstep" onclick="drillUpTo(0)">全部</span>']
      .concat(trail.map((d, i) => `<span class="cstep" onclick="drillUpTo(${i + 1})" title="回到这一层">${esc(d.label)}</span>`));
    $('chips').innerHTML = `<span class="muted" style="font-size:11px">逐层查看：</span>${steps.join(sep)}
      <span class="chip" style="background:#fff;border-color:var(--line);color:var(--muted)" onclick="resetFilters()">清空 ✕</span>
      <span class="muted" style="font-size:11px;margin-left:6px">点任务标题可看最底层明细</span>`;
    return;
  }
  if (f.owner) parts.push(`<span class="chip">负责人 <b>${esc(f.owner)}</b><i onclick="clearFilter('owner')">✕</i></span>`);
  if (f.domain) {
    const dd = ((state.data && state.data.domains) || []).find(x => x.code === f.domain) || {};
    parts.push(`<span class="chip">所属业务 <b>${esc(dd.label || f.domain)}</b><i onclick="clearFilter('domain')">✕</i></span>`);
  }
  if (f.source) parts.push(`<span class="chip">来源 <b>${esc(f.source)}</b><i onclick="clearFilter('source')">✕</i></span>`);
  (f.statuses || []).forEach(s => parts.push(`<span class="chip">状态 <b>${esc(ST_TEXT[s] || s)}</b><i onclick="toggleStatus('${s}', true)">✕</i></span>`));
  if (f.q) parts.push(`<span class="chip">搜索 <b>${esc(f.q)}</b><i onclick="clearFilter('q')">✕</i></span>`);
  $('chips').innerHTML = parts.length ? `<span class="muted" style="font-size:11px">当前筛选：</span>${parts.join('')}<span class="chip" style="background:#fff;border-color:var(--line);color:var(--muted)" onclick="resetFilters()">清空全部 ✕</span>` : '<span class="muted" style="font-size:11px">点上面的数字卡片逐层查看：业务 → 负责人 → 状态 → 明细</span>';
}

function renderHealth() {
  const s = (state.data && state.data.sources) || {};
  $('health').innerHTML = Object.keys(s).map(k => {
    const h = s[k]; const bad = h.ok === false || h.expired;
    return `<span class="h"><i class="dot ${bad ? 'bad' : ''}"></i>${esc(k)} · ${bad ? '数据可能不是最新' : '正常'} · ${h.itemCount || 0} 条 · ${h.ageMinutes == null ? '还没取到数据' : h.ageMinutes + ' 分钟前'}</span>`;
  }).join('') || '<span class="muted" style="font-size:12px">还没有数据，点上面的「刷新汇总」</span>';
}

function actionCell(x) {
  if (x.source === 'PLM2') {
    return `<button class="btn small" onclick="postProgress('${x.id}','in_progress')" title="点一下直接更新到 PLM（处理中）">开始</button><button class="btn small primary" onclick="postProgress('${x.id}','done')" title="点一下直接更新到 PLM（已完成）">完成</button>`;
  }
  if (x.origin === 'sync') return `<button class="btn small" onclick="assignTask('${x.id}')">分配</button>`;
  return `<button class="btn small" onclick="postProgress('${x.id}','in_progress')">开始</button><button class="btn small primary" onclick="postProgress('${x.id}','done')">完成</button>`;
}

function taskRowHtml(x) {
  return `
    <div class="item">
      <span class="tag ${ST_TAG[x.status] || 'gray'}" style="width:52px;text-align:center">${ST_TEXT[x.status] || x.status}</span>
      <span class="tag ${DOM_TAG[x.bizDomain] || 'gray'}" title="所属业务和来源系统">${esc(x.bizDomainLabel)}</span>
      <div class="it-body">
        <b style="cursor:pointer" title="点开看明细" onclick="event.stopPropagation();openTask('${x.id}')">${esc(x.title)}</b>
        <small>${esc(x.ownerName || '未分配')} · ${esc(x.sourceLabel)}${x.refs && x.refs.projectName ? ' · ' + esc(x.refs.projectName) : ''}${x.origin === 'extract' ? ' · 自动拆分加入' : ''}</small>
      </div>
      ${x.stale ? '<span class="tag orange" title="原来的系统暂时连不上，这里显示的是上次保存的数据">旧数据</span>' : ''}
      <span class="muted" style="font-size:12px;width:84px;text-align:right">${esc(x.due || '—')}</span>
      ${actionCell(x)}
    </div>`;
}

function domLabel(code) {
  return (((state.data || {}).domains || []).find(d => d.code === code) || {}).label || code || '';
}

function groupStatusChips(g) {
  return Object.keys(g.statusCounts).map(s => `<span class="tag ${ST_TAG[s] || 'gray'}">${ST_TEXT[s] || s}${g.statusCounts[s]}</span>`).join('');
}

function groupOwnerText(g) {
  const o = g.owners || [];
  return o.length > 3 ? o.slice(0, 3).join('、') + ' 等 ' + o.length + ' 人' : o.join('、');
}

// 列表 / 看板 / 表格 三种呈现（与 PLM 我的待办一致）
function renderList() {
  const rows = filtered();
  $('listCount').textContent = rows.length;
  renderModeBar();
  if (!rows.length) { $('list').innerHTML = '<div class="empty">无匹配任务</div>'; return; }
  if (state.mode === 'board') return renderBoardMode(rows);
  if (state.mode === 'table') return renderTableMode(rows);
  return renderListMode(rows);
}

function renderModeBar() {
  const m = state.mode || 'list';
  [['list', 'modeList'], ['board', 'modeBoard'], ['table', 'modeTable']].forEach(([k, id]) => {
    const el = $(id); if (el) el.classList.toggle('primary', m === k);
  });
  const hint = $('modeHint');
  if (hint) hint.textContent = m === 'board' ? '看板：按状态分列，点卡片展开每一条'
    : (m === 'table' ? '表格：一行一组，合并时可展开逐条' : '列表：可合并重复、点组头展开');
}

function renderListMode(rows) {
  const CAP = 200;
  if (state.group) {
    const groups = groupRows(rows);
    const shown = groups.slice(0, CAP);
    const more = groups.length > CAP ? `<div class="empty">已显示前 ${CAP} / ${groups.length} 组，请用筛选或搜索缩小范围</div>` : '';
    const head = `<div class="muted" style="font-size:11px;margin:2px 0 8px">${rows.length} 条 → 合并为 <b>${groups.length}</b> 组（标题相同就合并），点组头展开看每一条</div>`;
    $('list').innerHTML = head + shown.map(g => `
      <details class="grp">
        <summary>
          <span class="cnt ${g.count === 1 ? 'one' : ''}" title="出现次数">×${g.count}</span>
          <span class="tag ${DOM_TAG[g.bizDomain] || 'gray'}">${esc(domLabel(g.bizDomain))}</span>
          <span class="title" title="${esc(g.title)}">${esc(g.title)}</span>
          ${groupStatusChips(g)}
          <span class="muted" style="font-size:11px">${esc(groupOwnerText(g))}${g.earliestDue ? ' · 最早 ' + esc(g.earliestDue) : ''}</span>
        </summary>
        <div class="occ">${g.items.map(taskRowHtml).join('')}</div>
      </details>`).join('') + more;
  } else {
    const shown = rows.slice(0, CAP);
    const more = rows.length > CAP ? `<div class="empty">已显示前 ${CAP} / ${rows.length} 条，请用筛选或搜索缩小范围</div>` : '';
    $('list').innerHTML = shown.map(taskRowHtml).join('') + more;
  }
}

function renderBoardMode(rows) {
  const ORDER = ['overdue', 'pending', 'in_progress', 'blocked', 'confirmed', 'candidate', 'done', 'cancelled'];
  const cols = ORDER.filter(k => rows.some(x => x.status === k)).map(k => ({ k, items: rows.filter(x => x.status === k) }));
  const groups = state.group ? groupRows(rows) : null;
  const byStatus = {};
  if (groups) {
    groups.forEach(g => {
      const main = Object.keys(g.statusCounts).sort((a, b) => g.statusCounts[b] - g.statusCounts[a])[0];
      (byStatus[main] = byStatus[main] || []).push(g);
    });
  }
  $('list').innerHTML = `<div class="board">${cols.map(c => {
    const cards = state.group
      ? (byStatus[c.k] || [])
      : c.items.map(x => ({ key: x.id, title: x.title, count: 1, items: [x], owners: [x.ownerName || '未分配'], earliestDue: x.due, statusCounts: { [x.status]: 1 } }));
    return `<div class="bcol">
      <div class="bhead"><span class="tag ${ST_TAG[c.k] || 'gray'}">${ST_TEXT[c.k] || c.k}</span><b>${c.items.length}</b></div>
      ${cards.map(g => `
        <details class="bcard">
          <summary>
            <span class="cnt ${g.count === 1 ? 'one' : ''}" title="出现次数">×${g.count}</span>
            <span class="btitle" style="cursor:pointer" title="点开看明细" onclick="event.stopPropagation();openTask('${g.items[0].id}')">${esc(g.title)}</span>
            <span class="muted" style="font-size:11px">${esc((g.owners || []).slice(0, 2).join('、'))}${g.earliestDue ? ' · ' + esc(g.earliestDue) : ''}</span>
          </summary>
          <div class="occ">${g.items.map(taskRowHtml).join('')}</div>
        </details>`).join('') || '<div class="empty">无</div>'}
    </div>`;
  }).join('')}</div>`;
}

function renderTableMode(rows) {
  const CAP = 200;
  const groups = state.group ? groupRows(rows) : null;
  const head = '<thead><tr><th>状态</th><th>所属业务</th><th>事项</th><th>负责人</th><th>截止</th><th>来源</th><th>操作</th></tr></thead>';
  let body;
  if (groups) {
    body = groups.slice(0, CAP).map(g => {
      const main = Object.keys(g.statusCounts).sort((a, b) => g.statusCounts[b] - g.statusCounts[a])[0];
      const titleCell = g.count > 1
        ? `<details><summary style="cursor:pointer">${esc(g.title)} <span class="cnt">×${g.count}</span> <span class="muted" style="font-size:11px">展开看每一条</span></summary>
             <div class="occ" style="border:0">${g.items.map(x => `<div class="item" style="padding:4px 0;border:0"><small class="muted">${esc(x.ownerName || '未分配')} · ${esc(x.due || '—')} · ${esc(ST_TEXT[x.status] || x.status)}</small>${actionCell(x)}</div>`).join('')}</div></details>`
        : esc(g.title);
      return `<tr><td><span class="tag ${ST_TAG[main] || 'gray'}">${ST_TEXT[main] || main}</span></td>
        <td><span class="tag ${DOM_TAG[g.bizDomain] || 'gray'}">${esc(domLabel(g.bizDomain))}</span></td>
        <td>${titleCell}</td><td>${esc(groupOwnerText(g))}</td><td>${esc(g.earliestDue || '—')}</td>
        <td>${esc(g.items[0].sourceLabel || '')}</td><td style="white-space:nowrap">${actionCell(g.items[0])}</td></tr>`;
    }).join('');
  } else {
    body = rows.slice(0, CAP).map(x => `<tr><td><span class="tag ${ST_TAG[x.status] || 'gray'}">${esc(x.statusText || x.status)}</span></td>
      <td><span class="tag ${DOM_TAG[x.bizDomain] || 'gray'}">${esc(x.bizDomainLabel)}</span></td>
      <td>${esc(x.title)}</td><td>${esc(x.ownerName || '未分配')}</td><td>${esc(x.due || '—')}</td>
      <td>${esc(x.sourceLabel)}</td><td style="white-space:nowrap">${actionCell(x)}</td></tr>`).join('');
  }
  const moreG = groups && groups.length > CAP ? `<div class="empty">已显示前 ${CAP} / ${groups.length} 组</div>` : '';
  const moreR = !groups && rows.length > CAP ? `<div class="empty">已显示前 ${CAP} / ${rows.length} 条</div>` : '';
  $('list').innerHTML = `<div class="panel" style="padding:0;border:0"><table>${head}<tbody>${body}</tbody></table></div>${moreG}${moreR}`;
}

function renderOwners() {
  const rows = filtered();
  const map = {};
  rows.forEach(x => { const k = x.ownerName || '未分配'; (map[k] = map[k] || { total: 0, overdue: 0, pending: 0, done: 0 }); map[k].total++; if (x.status === 'overdue') map[k].overdue++; else if (x.status === 'done') map[k].done++; else map[k].pending++; });
  const keys = Object.keys(map).sort((a, b) => map[b].total - map[a].total);
  $('ownerCount').textContent = keys.length + ' 人';
  $('owners').innerHTML = keys.length ? `<table><thead><tr><th>负责人</th><th>合计</th><th>逾期</th><th>待办/进行</th><th>完成</th></tr></thead><tbody>
    ${keys.map(k => `<tr style="cursor:pointer" onclick="drill('owner','${esc(k)}')"><td>${esc(k)}</td><td><b>${map[k].total}</b></td><td>${map[k].overdue ? '<span class="tag red">' + map[k].overdue + '</span>' : '0'}</td><td>${map[k].pending}</td><td>${map[k].done}</td></tr>`).join('')}
  </tbody></table>` : '<div class="empty">无数据</div>';
}

function renderCands() {
  const cs = state.cands || [];
  $('candCount').textContent = cs.length;
  if (!cs.length) { $('cands').innerHTML = '<div class="empty">暂无待确认的内容：已经汇总过的不再重复拆，文字乱码的会跳过</div>'; return; }
  $('cands').innerHTML = cs.map(c => `
    <div class="cand">
      <b>${esc(c.title)}</b>
      <div class="muted" style="font-size:11px">来源 ${esc(c.sourceLabel)} · ${esc(c.bizDomain)} · 期限 ${esc(c.due || '未识别')} · 负责人 ${esc(c.ownerName || '未识别')} · 置信度 ${c.confidence}</div>
      <div class="row">
        <button class="btn small primary" onclick="confirmCand('${c.id}')">确认加入总表</button>
        <button class="btn small" onclick="rejectCand('${c.id}')">不加入</button>
        <span class="tag gray" title="${esc(c.engineNote)}">按文字规则拆分</span>
      </div>
    </div>`).join('');
}

function renderFilters() {
  const d = state.data; if (!d) return;
  const owners = Object.keys((d.counts && d.counts.byOwner) || {});
  $('fOwner').innerHTML = '<option value="">全部负责人</option>' + owners.map(o => `<option ${state.filters.owner === o ? 'selected' : ''}>${esc(o)}</option>`).join('');
  $('fDomain').innerHTML = '<option value="">全部所属业务</option>' + (d.domains || []).map(x => `<option value="${x.code}" ${state.filters.domain === x.code ? 'selected' : ''}>${esc(x.label)} → ${esc(x.bizSysLabel)}</option>`).join('');
  const srcs = [...new Set((d.items || []).map(x => x.source))];
  $('fSource').innerHTML = '<option value="">全部来源</option>' + srcs.map(s => `<option ${state.filters.source === s ? 'selected' : ''}>${esc(s)}</option>`).join('');
  renderStatusMenu();
}

function renderStatusMenu() {
  const d = state.data; if (!d) return;
  const counts = (d.counts && d.counts.byStatus) || {};
  const order = ['overdue', 'pending', 'in_progress', 'confirmed', 'candidate', 'blocked', 'done', 'cancelled'];
  const keys = order.filter(k => counts[k]);
  Object.keys(counts).forEach(k => { if (!keys.includes(k)) keys.push(k); });
  const sel = state.filters.statuses || [];
  $('msStatusMenu').innerHTML = keys.map(k => `
      <label class="ms-item"><input type="checkbox" value="${k}" ${sel.includes(k) ? 'checked' : ''} onchange="toggleStatus('${k}')">
        <span class="tag ${ST_TAG[k] || 'gray'}">${ST_TEXT[k] || k}</span><span class="muted">${counts[k]}</span></label>`).join('') +
    `<div class="ms-foot"><button class="btn small" onclick="toggleStatus('__all__')">全选</button><button class="btn small" onclick="toggleStatus('__none__')">清空</button></div>`;
  const btn = $('msStatusBtn');
  btn.textContent = sel.length ? '状态 ' + sel.length + ' 项' : '全部状态';
  btn.classList.toggle('on', sel.length > 0);
}

function renderAll() {
  const d = state.data;
  $('upd').textContent = d && d.updatedAt ? '汇总时间：' + d.updatedAt.slice(0, 16).replace('T', ' ') : '还没有汇总';
  renderViewBar();
  renderHealth(); renderKpis(); renderChips(); renderList(); renderOwners(); renderCands();
}

// ── 视图：总库 / 个人待办 / 部门待办 ──────────────────
function renderViewBar() {
  const map = { hub: 'viewHub', person: 'viewPerson', dept: 'viewDept' };
  Object.keys(map).forEach(k => $(map[k]).classList.toggle('primary', state.view === k));
  const d = state.data || {};
  const owners = Object.keys((d.counts && d.counts.byOwner) || {});
  const depts = [...new Set((state.people || []).map(p => p.dept).filter(Boolean))];
  let extra = '';
  if (state.view === 'person') {
    extra = `<select id="selPerson">${owners.map(o => `<option ${state.person === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (state.view === 'dept') {
    extra = `<select id="selDept">${depts.map(x => `<option ${state.dept === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
      <span class="muted" style="font-size:11px">${state.deptData ? '部门任务 ' + state.deptData.counts.total + ' 条' : '加载中…'}</span>`;
  }
  $('viewExtra').innerHTML = extra;
  if (state.view === 'person') $('selPerson').onchange = (e) => { state.person = e.target.value; renderAll(); };
  if (state.view === 'dept') $('selDept').onchange = async (e) => { state.dept = e.target.value; await loadDept(); renderAll(); };
}

async function loadDept() {
  if (!state.dept) {
    const depts = [...new Set((state.people || []).map(p => p.dept).filter(Boolean))];
    state.dept = depts[0] || '研发中心';
  }
  try {
    state.deptData = await api('/api/v1/tasks/dept?dept=' + encodeURIComponent(state.dept));
  } catch (e) {
    state.deptData = { dept: state.dept, items: [], counts: { total: 0 }, byOwner: [], error: e.message };
  }
}

window.setMode = (m) => {
  state.mode = m;
  try { localStorage.setItem('taskhub-mode', m); } catch (e) { /* 隐私模式忽略 */ }
  renderList();
};
window.setView = async (v) => {
  state.view = v;
  if (v === 'person' && !state.person) {
    const owners = Object.keys(((state.data || {}).counts || {}).byOwner || {});
    state.person = owners[0] || '';
  }
  if (v === 'dept') await loadDept();
  renderAll();
};

window.postProgress = async (id, status) => {
  const actor = state.view === 'person' ? state.person : prompt('操作人（M10 人员姓名）', state.person || '');
  if (!actor) return toast('请先填写操作人，方便留下记录');
  try {
    await api('/api/v1/tasks/' + encodeURIComponent(id) + '/progress', 'POST', { status, actor });
    toast(status === 'done' ? '已完成，已同步到总表' : '已开始，已同步到总表');
    await reloadAll();
  } catch (e) { toast('更新失败：' + e.message); }
};

// 即时同步：总库/个人/部门任一变更 → 服务端 SSE 推送 → 页面重载
let reloadTimer = null;
function connectStream() {
  try {
    const es = new EventSource('/api/v1/tasks/stream');
    es.onopen = () => { $('syncState').textContent = '自动更新：已连接'; };
    es.onerror = () => { $('syncState').textContent = '自动更新：重新连接中…'; };
    es.onmessage = (ev) => {
      let m = {}; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.kind === 'hello') return;
      if (m.kind === 'plm-sync') toast('PLM 状态已同步到总库');
      $('syncState').textContent = '实时同步：收到「' + m.kind + '」更新';
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(() => reloadAll(), 400);
    };
  } catch (e) { $('syncState').textContent = '自动更新：暂不可用'; }
}

async function reloadAll() {
  state.data = await api('/api/v1/tasks');
  await loadCands();
  if (state.view === 'dept') await loadDept();
  renderFilters(); renderAll();
}

// 数字卡片点开看明细（逐层下钻：业务 → 负责人 → 状态 → 任务 → 明细）
function drillLabel(dim, key) {
  if (dim === 'status') return ST_TEXT[key] || key;
  if (dim === 'domain') return (((state.data || {}).domains || []).find(d => d.code === key) || {}).label || key;
  return key;
}
function applyDrill() {
  const f = state.filters;
  f.owner = ''; f.domain = ''; f.statuses = [];
  (state.drill || []).forEach(d => {
    if (d.dim === 'owner') f.owner = d.value;
    if (d.dim === 'domain') f.domain = d.value;
    if (d.dim === 'status') f.statuses = [d.value];
  });
  syncControls();
}
window.drill = (dim, key) => {
  if (key === 'all') {
    state.drill = [];
    state.filters = { owner: '', domain: '', source: '', statuses: [], q: '' };
    syncControls(); renderFilters(); renderAll();
    return;
  }
  state.drill = state.drill || [];
  const idx = state.drill.findIndex(d => d.dim === dim && d.value === key);
  if (idx >= 0) state.drill = state.drill.slice(0, idx);
  else state.drill = state.drill.filter(d => d.dim !== dim).concat([{ dim, value: key, label: drillLabel(dim, key) }]);
  applyDrill(); renderFilters(); renderAll();
};
window.drillUpTo = (i) => { state.drill = (state.drill || []).slice(0, i); applyDrill(); renderFilters(); renderAll(); };

/* 最底层：单条任务明细 */
window.openTask = (id) => {
  const list = (state.view === 'dept' && state.deptData ? state.deptData.items : (state.data || {}).items) || [];
  const x = list.find(v => v.id === id);
  if (!x) return toast('找不到这条任务');
  const rows = [
    ['任务', x.title], ['状态', x.statusText || x.status], ['所属业务', x.bizDomainLabel || x.bizDomain],
    ['负责人', x.ownerName || '未指定'], ['截止', x.due || '无'], ['来源', x.sourceLabel + '（' + x.source + '）'],
    ['来源 ID', x.sourceId], ['快照时间', (x.fetchedAt || '').slice(0, 19).replace('T', ' ')],
    x.stale ? ['提示', '原来的系统暂时连不上，显示的是上次保存的数据'] : null,
    x.verifiedBy ? ['确认人', x.verifiedBy] : null,
    x.plmSyncedAt ? ['PLM 已同步', x.plmSyncedAt.slice(0, 19).replace('T', ' ')] : null
  ].filter(Boolean);
  const refs = x.refs || {};
  const refRows = Object.keys(refs).filter(k => refs[k] != null && refs[k] !== '').map(k => `[${esc(k)}] ${esc(typeof refs[k] === 'object' ? JSON.stringify(refs[k]) : refs[k])}`).join('<br>');
  $('detailBody').innerHTML = `
    <div class="dl">${rows.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    <div class="dsec">来源数据</div>
    <div class="drefs">${refRows || '（无）'}</div>
    <div class="dsec">处理</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      ${x.source === 'PLM2' ? `<button class="btn small" onclick="closeTask();postProgress('${x.id}','in_progress')">开始（同步到 PLM）</button>
        <button class="btn small primary" onclick="closeTask();postProgress('${x.id}','done')">完成（同步到 PLM）</button>
        <a class="btn small" href="/plm2" target="_blank" rel="noopener">在 PLM 打开</a>` : ''}
      ${x.origin !== 'sync' ? `<button class="btn small" onclick="closeTask();postProgress('${x.id}','in_progress')">开始</button>
        <button class="btn small primary" onclick="closeTask();postProgress('${x.id}','done')">完成</button>` : ''}
      ${x.source === 'MEETING' ? '<span class="muted" style="font-size:12px">会议任务请到会议助手处理</span>' : ''}
      ${x.source === 'HUB' ? '<span class="muted" style="font-size:12px">Hub 任务请到 Hub 处理</span>' : ''}
    </div>`;
  $('taskDetail').classList.add('open');
};
window.closeTask = () => $('taskDetail').classList.remove('open');

window.toggleStatus = (key, forceRemove) => {
  const f = state.filters;
  const counts = (state.data && state.data.counts && state.data.counts.byStatus) || {};
  if (key === '__all__') f.statuses = Object.keys(counts);
  else if (key === '__none__') f.statuses = [];
  else if (forceRemove) f.statuses = f.statuses.filter(s => s !== key);
  else f.statuses = f.statuses.includes(key) ? f.statuses.filter(s => s !== key) : f.statuses.concat(key);
  renderStatusMenu(); renderAll();
};
window.clearFilter = (k) => {
  const f = state.filters;
  if (k === 'statuses') f.statuses = []; else f[k] = '';
  state.drill = (state.drill || []).filter(d => !((k === 'owner' && d.dim === 'owner') || (k === 'domain' && d.dim === 'domain') || (k === 'statuses' && d.dim === 'status')));
  applyDrill(); renderFilters(); renderAll();
};
window.resetFilters = () => {
  state.filters = { owner: '', domain: '', source: '', statuses: [], q: '' };
  state.drill = [];
  syncControls(); renderFilters(); renderAll();
};
function syncControls() {
  const f = state.filters;
  $('fOwner').value = f.owner || '';
  $('fDomain').value = f.domain || '';
  $('fSource').value = f.source || '';
  $('fQ').value = f.q || '';
}

async function load() {
  const d = await api('/api/v1/tasks');
  state.data = d;
  if (!d.total) {
    toast('还没有数据，正在第一次汇总…');
    await api('/api/v1/tasks/refresh', 'POST', {});
    state.data = await api('/api/v1/tasks');
  }
  await loadCands();
  renderFilters(); renderAll();
}

async function loadCands() {
  try { state.cands = (await api('/api/v1/tasks/candidates')).candidates || []; }
  catch (e) { state.cands = []; }
}

async function loadPeople() {
  try {
    const d = await api('/api/v1/plm2/people');
    state.people = d.people || [];
    const roles = ['ADMIN', 'admin', 'gm', 'rd_manager', 'project_manager', 'hr_manager', 'cw1', 'sales_director', 'sales_manager'];
    const ok = state.people.filter(p => (p.realRoles && p.realRoles.some(r => roles.includes(r))) || roles.includes(p.role));
    $('reviewers').innerHTML = ok.map(p => `<option value="${esc(p.name)}">`).join('');
  } catch (e) { /* 人员接口不可用不影响查看 */ }
}

window.pickOwner = (o) => { state.filters.owner = o; $('fOwner').value = o; renderAll(); };
window.confirmCand = async (id) => {
  if (!reviewer()) return toast('请先填写确认人（有权限的管理员）');
  const c = state.cands.find(x => x.id === id) || {};
  try {
    const r = await api('/api/v1/tasks/candidates/' + encodeURIComponent(id) + '/confirm', 'POST', { reviewer: reviewer(), ownerName: c.ownerName || '' });
    toast('已加入总表：' + (r.item ? r.item.title : ''));
    state.data = await api('/api/v1/tasks'); await loadCands(); renderFilters(); renderAll();
  } catch (e) { toast('加入失败：' + e.message); }
};
window.rejectCand = async (id) => {
  if (!reviewer()) return toast('请先填写确认人（有权限的管理员）');
  try {
    await api('/api/v1/tasks/candidates/' + encodeURIComponent(id) + '/reject', 'POST', { reviewer: reviewer(), reason: '人工判定非任务' });
    toast('已标记不加入'); await loadCands(); renderCands();
  } catch (e) { toast('操作失败：' + e.message); }
};
window.assignTask = async (id) => {
  const it = (state.data.items || []).find(x => x.id === id);
  if (!it) return;
  if (it.origin === 'sync') { toast('这条待办由 ' + it.bizSysLabel + ' 管理，请到那里修改；这里只做展示，避免两边不一致'); return; }
  if (!reviewer()) return toast('请先在右侧填写确认人（有权限的管理员）');
  const owner = prompt('分发给哪位负责人？', it.ownerName || ''); if (!owner) return;
  try {
    await api('/api/v1/tasks/' + encodeURIComponent(id) + '/assign', 'POST', { ownerName: owner, reviewer: reviewer() });
    toast('已分配给：' + owner);
    state.data = await api('/api/v1/tasks'); renderFilters(); renderAll();
  } catch (e) { toast('分配失败：' + e.message); }
};

$('btnRefresh').onclick = async () => {
  const b = $('btnRefresh'); b.disabled = true;
  try { const r = await api('/api/v1/tasks/refresh', 'POST', {}); toast('汇总完成：' + r.total + ' 条'); state.data = await api('/api/v1/tasks'); await loadCands(); renderFilters(); renderAll(); }
  catch (e) { toast('汇总失败：' + e.message); } finally { b.disabled = false; }
};
$('btnPlmSync').onclick = async () => {
  const b = $('btnPlmSync'); b.disabled = true;
  try {
    const r = await api('/api/v1/tasks/plm-sync', 'POST', {});
    toast('PLM 同步完成：拉取 ' + r.pull.pulled + ' 个项目（失败 ' + r.pull.failed + '），总库 ' + r.taskhub.total + ' 条');
    await reloadAll();
  } catch (e) { toast('PLM 同步失败：' + e.message); } finally { b.disabled = false; }
};
$('btnExtract').onclick = async () => {
  const b = $('btnExtract'); b.disabled = true;
  try {
    const r = await api('/api/v1/tasks/extract', 'POST', {});
    const sk = (r.skipped || []).length;
    toast('拆分完成：新增待确认 ' + r.produced + ' 条' + (sk ? '，跳过编码损坏 ' + sk + ' 条' : '') + '（确认后才会加入总表）');
    await loadCands(); renderCands();
  } catch (e) { toast('抽取失败：' + e.message); } finally { b.disabled = false; }
};
$('btnExtractText').onclick = async () => {
  const text = ($('fText').value || '').trim();
  if (!text) return toast('请先把文字粘贴进来');
  const b = $('btnExtractText'); b.disabled = true;
  try {
    const r = await api('/api/v1/tasks/extract', 'POST', { text });
    toast('拆分完成：新增待确认 ' + r.produced + ' 条（确认后才会加入总表）');
    $('fText').value = '';
    await loadCands(); renderCands();
  } catch (e) { toast('拆分失败：' + e.message); } finally { b.disabled = false; }
};
['fOwner', 'fDomain', 'fSource', 'fQ'].forEach(id => {
  $(id).addEventListener('input', () => {
    const f = state.filters;
    f.owner = $('fOwner').value; f.domain = $('fDomain').value;
    f.source = $('fSource').value; f.q = $('fQ').value;
    renderAll();
  });
});
$('fGroup').addEventListener('change', () => { state.group = $('fGroup').checked; renderList(); });
$('msStatusBtn').onclick = (e) => { e.stopPropagation(); $('msStatus').classList.toggle('open'); };
document.addEventListener('click', (e) => {
  if (!$('msStatus').contains(e.target)) $('msStatus').classList.remove('open');
});
$('btnClear').onclick = () => resetFilters();
loadPeople();
load().then(() => { connectStream(); }).catch(e => { toast('加载失败：' + e.message); });
</script>
</body>
</html>
